{% extends "base.html" %}

{% block title %}Edit Item - LOSTLINK{% endblock %}

{% block content %}
<div class="container" style="padding: 3rem 1rem; max-width: 750px;">
  <div class="card" style="border-radius: var(--radius-xl); box-shadow: var(--shadow-xl); overflow: hidden;">
    
    <div class="card-header" style="background: var(--navy-900); color: white; padding: 1.5rem 2rem;">
      <h2 style="color: white; font-size: 1.5rem; margin: 0;">
        <i class="fa-solid fa-pen-to-square" style="color: var(--orange-400); margin-right: 0.4rem;"></i>
        Edit Item Report: {{ item.title }}
      </h2>
    </div>

    <div class="card-body" style="padding: 2.25rem;">
      <form action="{{ url_for('edit_item', item_id=item.id) }}" method="POST">
        
        <div class="form-group">
          <label class="form-label">Item Title <span class="required">*</span></label>
          <input type="text" name="title" class="form-control" value="{{ item.title }}" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
          <div class="form-group">
            <label class="form-label">Category</label>
            <select name="category" class="form-select" required>
              {% for cat in categories %}
                <option value="{{ cat.id }}" {% if item.category == cat.id %}selected{% endif %}>{{ cat.name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Location <span class="required">*</span></label>
            <input type="text" name="location" class="form-control" value="{{ item.location }}" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
          <div class="form-group">
            <label class="form-label">Brand</label>
            <input type="text" name="brand" class="form-control" value="{{ item.brand or '' }}">
          </div>

          <div class="form-group">
            <label class="form-label">Color</label>
            <input type="text" name="color" class="form-control" value="{{ item.color or '' }}">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Description <span class="required">*</span></label>
          <textarea name="description" class="form-control" rows="4" required>{{ item.description }}</textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Status</label>
          <select name="status" class="form-select">
            {% if item.type == 'lost' %}
              <option value="Lost" {% if item.status == 'Lost' %}selected{% endif %}>Lost</option>
              <option value="Under Claim" {% if item.status == 'Under Claim' %}selected{% endif %}>Under Claim</option>
              <option value="Recovered" {% if item.status == 'Recovered' %}selected{% endif %}>Recovered</option>
              <option value="Closed" {% if item.status == 'Closed' %}selected{% endif %}>Closed</option>
            {% else %}
              <option value="Available" {% if item.status == 'Available' %}selected{% endif %}>Available</option>
              <option value="Claim Pending" {% if item.status == 'Claim Pending' %}selected{% endif %}>Claim Pending</option>
              <option value="Returned to Owner" {% if item.status == 'Returned to Owner' %}selected{% endif %}>Returned to Owner</option>
              <option value="Archived" {% if item.status == 'Archived' %}selected{% endif %}>Archived</option>
            {% endif %}
          </select>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 2rem;">
          <a href="{{ url_for('item_detail', item_id=item.id) }}" class="btn btn-outline-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>

      </form>
    </div>

  </div>
</div>
{% endblock %}
