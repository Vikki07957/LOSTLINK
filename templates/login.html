{% extends "base.html" %}

{% block title %}Sign In - LOSTLINK Smart Lost & Found Platform{% endblock %}

{% block content %}
<div class="container" style="padding: 3.5rem 1rem; max-width: 520px;">
  <div class="card" style="border-radius: var(--radius-xl); box-shadow: var(--shadow-xl); overflow: hidden;">
    
    <!-- Card Header -->
    <div style="background: linear-gradient(135deg, var(--navy-900), #1e1b4b); color: white; padding: 2.25rem 2rem; text-align: center;">
      <div class="brand-icon-box" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.4rem;">
        <i class="fa-solid fa-arrow-right-to-bracket"></i>
      </div>
      <h2 style="color: white; font-size: 1.85rem; margin-bottom: 0.4rem;">Welcome Back</h2>
      <p style="color: #cbd5e1; font-size: 0.95rem;">Sign in to your LOSTLINK account</p>
    </div>

    <!-- Login Form -->
    <div class="card-body" style="padding: 2.25rem;">
      
      <!-- Viva Demo 1-Click Credentials Banner -->
      <div style="background: var(--indigo-50); border: 1px solid var(--indigo-100); border-radius: var(--radius-md); padding: 1rem; margin-bottom: 1.5rem;">
        <div style="font-size: 0.8rem; font-weight: 700; color: var(--indigo-700); text-transform: uppercase; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.4rem;">
          <i class="fa-solid fa-bolt"></i> Examiner / Viva Demo Quick Access:
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <button type="button" onclick="fillDemoCredentials('admin')" class="btn btn-sm btn-outline-primary" style="flex: 1; font-size: 0.8rem; background: white;">
            <i class="fa-solid fa-shield-halved"></i> 1-Click Admin
          </button>
          <button type="button" onclick="fillDemoCredentials('user')" class="btn btn-sm btn-outline-secondary" style="flex: 1; font-size: 0.8rem;">
            <i class="fa-solid fa-user"></i> 1-Click Student
          </button>
        </div>
      </div>

      <form action="{{ url_for('login') }}" method="POST">
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

        <div class="form-group">
          <label class="form-label">Email Address <span class="required">*</span></label>
          <div class="input-icon-group">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" name="email" id="email" class="form-control" placeholder="e.g. rahul@lostlink.com" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
            <label class="form-label" style="margin-bottom: 0;">Password <span class="required">*</span></label>
            <a href="#" onclick="alert('For viva demo, use admin@lostlink.com / admin123 or rahul@lostlink.com / user123'); return false;" style="font-size: 0.8rem; color: var(--indigo-600);">Forgot password?</a>
          </div>
          <div class="input-icon-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; margin-top: 0.75rem;">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); font-size: 0.92rem; color: var(--text-muted);">
        Don't have an account yet? <a href="{{ url_for('register') }}" style="font-weight: 700; color: var(--indigo-600);">Register here</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
